<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Axolotl Zero — SD</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0a1410;color:#eee;font-family:system-ui,'Segoe UI',sans-serif}
header{background:#111e18;padding:14px 16px;position:sticky;top:0}
h1{margin:0;color:#ff8c00;font-size:20px;letter-spacing:1px}
.path{color:#9fd;font-size:13px;margin-top:6px;word-break:break-all}
.wrap{max-width:820px;margin:0 auto;padding:12px 16px}
.row{display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid #1a2e24}
.row a{color:#eee;text-decoration:none;flex:1;word-break:break-all}
.dir a{color:#ff8c00;font-weight:600}
.sz{color:#567;font-size:12px;white-space:nowrap}
.btn{background:#1a2e24;color:#9fd;border:none;border-radius:6px;padding:6px 10px;cursor:pointer;font-size:13px;text-decoration:none}
.btn:hover{background:#26463a}
.del{color:#ff6b6b}
.up{margin:10px 0;display:inline-block}
form{margin:16px 0;padding:14px;background:#111e18;border-radius:10px}
input[type=file]{color:#9fd}
button.upload{background:linear-gradient(135deg,#ff8c00,#e67600);color:#0a1410;border:none;border-radius:8px;padding:10px 16px;font-weight:700;cursor:pointer;margin-top:8px}
.empty{color:#567;padding:20px;text-align:center}
</style>
</head>
<body>
<header>
  <h1>📂 Axolotl Zero — carte SD</h1>
  <div class="path" id="path">/sdcard</div>
</header>
<div class="wrap">
  <a class="btn up" id="up" href="#">⬆ dossier parent</a>
  <div id="list"><div class="empty">chargement…</div></div>
  <form id="upform">
    <div><b>Envoyer un fichier ici :</b></div>
    <input type="file" id="file">
    <div><button type="submit" class="upload">Uploader dans ce dossier</button></div>
  </form>
</div>
<script>
var cur = "/sdcard";

function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function join(a,b){return (a.endsWith("/")?a.slice(0,-1):a)+"/"+b;}

function load(path){
  cur = path;
  document.getElementById("path").textContent = cur;
  fetch("/api/files?path="+encodeURIComponent(cur))
    .then(function(r){return r.json();})
    .then(render)
    .catch(function(){document.getElementById("list").innerHTML='<div class="empty">erreur de lecture</div>';});
}

function render(items){
  var el = document.getElementById("list");
  if(!items || !items.length){ el.innerHTML='<div class="empty">(dossier vide)</div>'; return; }
  var h = "";
  items.forEach(function(it){
    var full = join(cur, it.n);
    var fq = full.replace(/'/g,"\\'");
    if(it.d){
      h += '<div class="row dir"><a href="#" onclick="load(\''+fq+'\');return false;">📁 '+esc(it.n)+'</a></div>';
    } else {
      h += '<div class="row"><a href="/file?path='+encodeURIComponent(full)+'" download>📄 '+esc(it.n)+'</a>'
         + '<span class="sz">'+it.s+' o</span>'
         + '<a class="btn" href="/file?path='+encodeURIComponent(full)+'" download>⬇</a>'
         + '<button class="btn del" onclick="del(\''+fq+'\')">🗑</button></div>';
    }
  });
  el.innerHTML = h;
}

function del(path){
  if(!confirm("Supprimer "+path+" ?")) return;
  fetch("/api/rm?path="+encodeURIComponent(path)).then(function(){load(cur);});
}

document.getElementById("up").onclick=function(e){
  e.preventDefault();
  if(cur.length<=1) return;
  var p = cur.replace(/\/+$/,"");
  var i = p.lastIndexOf("/");
  load(i<=0 ? "/" : p.slice(0,i));
};

document.getElementById("upform").onsubmit=function(e){
  e.preventDefault();
  var f = document.getElementById("file").files[0];
  if(!f){ alert("choisis un fichier"); return; }
  fetch("/file?path="+encodeURIComponent(join(cur,f.name)),{method:"POST",body:f})
    .then(function(r){ return r.text(); })
    .then(function(){ document.getElementById("file").value=""; load(cur); })
    .catch(function(){ alert("upload échoué"); });
};

load("/sdcard");
</script>
</body>
</html>
