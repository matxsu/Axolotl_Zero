<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Axolotl Zero</title>
  <style>
    :root{--bg:#0d1117;--panel:#161b22;--border:#30363d;--text:#e6edf3;--green:#3fb950;--orange:#f0883e;--red:#f85149}
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--text);font:13px/1.6 'Courier New',monospace;min-height:100vh}
    header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
    h1{color:var(--green);font-size:18px;letter-spacing:1px}
    .badge{padding:2px 8px;border-radius:3px;font-size:11px;background:var(--panel);border:1px solid var(--border)}
    .badge.ok{color:var(--green);border-color:var(--green)}
    .badge.err{color:var(--red);border-color:var(--red)}
    .tabs{display:flex;border-bottom:1px solid var(--border);padding:0 20px}
    .tab{padding:9px 18px;cursor:pointer;border-bottom:2px solid transparent;color:#666;transition:.15s}
    .tab.active{color:var(--green);border-color:var(--green)}
    .tab:hover:not(.active){color:var(--text)}
    .panel{display:none;padding:20px}
    .panel.active{display:block}
    .file-list{list-style:none;margin-bottom:18px}
    .file-item{display:flex;align-items:center;padding:7px 12px;border:1px solid var(--border);border-radius:4px;margin-bottom:5px;background:var(--panel)}
    .fname{flex:1;font-size:12px;color:var(--text);word-break:break-all}
    .fsize{color:#555;font-size:11px;margin:0 10px;min-width:55px;text-align:right;white-space:nowrap}
    .btn{padding:5px 12px;background:transparent;border:1px solid var(--green);color:var(--green);border-radius:3px;cursor:pointer;font:11px 'Courier New',monospace;white-space:nowrap}
    .btn:hover{background:var(--green);color:var(--bg)}
    .upload{border:1px dashed var(--border);border-radius:5px;padding:18px;text-align:center;cursor:pointer;transition:.15s}
    .upload:hover{border-color:var(--green)}
    .upload input{display:none}
    .upload label{cursor:pointer;color:var(--green)}
    .toast{padding:7px 12px;border-radius:3px;margin-bottom:12px;font-size:12px;display:none}
    .toast.ok{background:#1a3a1a;color:var(--green);display:block}
    .toast.err{background:#3a1a1a;color:var(--red);display:block}
    .empty{color:#555;padding:8px;font-size:12px}
    .ml-auto{margin-left:auto}
  </style>
</head>
<body>
  <header>
    <h1>&#x1F98E; AXOLOTL ZERO</h1>
    <span id="sd-badge" class="badge">SD ...</span>
    <span id="ip-badge" class="badge ml-auto">192.168.4.1</span>
  </header>
  <div class="tabs">
    <div class="tab active" onclick="sw('dumps')">Dumps</div>
    <div class="tab" onclick="sw('dicts')">Dicts</div>
  </div>
  <div id="p-dumps" class="panel active">
    <div id="t-dumps" class="toast"></div>
    <ul class="file-list" id="l-dumps"></ul>
    <div class="upload">
      <label>&#x2B06; Importer dump (.mfd / .txt)
        <input type="file" accept=".mfd,.txt" onchange="up(this,'dumps')">
      </label>
    </div>
  </div>
  <div id="p-dicts" class="panel">
    <div id="t-dicts" class="toast"></div>
    <ul class="file-list" id="l-dicts"></ul>
    <div class="upload">
      <label>&#x2B06; Importer dictionnaire (.txt / .dic)
        <input type="file" accept=".txt,.dic" onchange="up(this,'dicts')">
      </label>
    </div>
  </div>
  <script>
    function sw(t){
      ['dumps','dicts'].forEach(function(x,i){
        document.querySelectorAll('.tab')[i].className='tab'+(x==t?' active':'');
        document.getElementById('p-'+x).className='panel'+(x==t?' active':'');
      });
      load(t);
    }
    async function load(d){
      try{
        var r=await fetch('/api/files?dir='+d);
        var f=await r.json();
        var ul=document.getElementById('l-'+d);
        if(!f.length){ul.innerHTML='<li class="empty">Aucun fichier</li>';return;}
        ul.innerHTML=f.map(function(x){
          return '<li class="file-item"><span class="fname">'+esc(x.n)+'</span>'
            +'<span class="fsize">'+sz(x.s)+'</span>'
            +'<button class="btn" onclick="dl(\''+d+'\',\''+esc(x.n)+'\')">&#x2B07; DL</button></li>';
        }).join('');
      }catch(e){toast(d,'Erreur: '+e,1);}
    }
    function dl(d,n){
      var b=d=='dicts'?'/sdcard/NFC/dicts/':'/sdcard/NFC/dumps/';
      var a=document.createElement('a');
      a.href='/file?path='+encodeURIComponent(b+n);
      a.download=n;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }
    async function up(inp,d){
      if(!inp.files.length)return;
      var f=inp.files[0];
      var b=d=='dicts'?'/sdcard/NFC/dicts/':'/sdcard/NFC/dumps/';
      try{
        var r=await fetch('/file?path='+encodeURIComponent(b+f.name),{method:'POST',body:await f.arrayBuffer()});
        if(r.ok){toast(d,'OK: '+esc(f.name),0);load(d);}
        else{toast(d,'Erreur HTTP '+r.status,1);}
      }catch(e){toast(d,'Erreur: '+e,1);}
      inp.value='';
    }
    function sz(b){if(b<1024)return b+' B';if(b<1048576)return(b/1024).toFixed(1)+' KB';return(b/1048576).toFixed(1)+' MB';}
    function esc(s){var d=document.createElement('div');d.appendChild(document.createTextNode(s));return d.innerHTML;}
    function toast(d,m,e){
      var el=document.getElementById('t-'+d);
      el.textContent=m;
      el.className='toast '+(e?'err':'ok');
      setTimeout(function(){el.className='toast';},4000);
    }
    async function status(){
      try{
        var r=await fetch('/api/status');
        var j=await r.json();
        var b=document.getElementById('sd-badge');
        b.className='badge '+(j.sd?'ok':'err');
        b.textContent='SD '+(j.sd?'OK':'ERR');
      }catch(e){}
    }
    status();
    load('dumps');
  </script>
</body>
</html>
