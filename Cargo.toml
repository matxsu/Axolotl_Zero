[package]
name = "fz"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "fz"
path = "src/main.rs"

[dependencies]
esp32-nimble = "0.12"
esp-idf-svc = "0.52"
log = "0.4"
anyhow = "1"
mipidsi = "0.8"
embedded-graphics = "0.8"
display-interface-spi = "0.5"

[build-dependencies]
embuild = "0.33"

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "z"



